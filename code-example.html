<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Cartoon UI</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Comic Sans MS", sans-serif;
            background: #d8edf2;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .game-ui {
            width: 1000px;
            padding: 40px;
        }

        .row {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            align-items: center;
            margin-bottom: 30px;
        }

        /* ===== Cartoon Button ===== */

        .cartoon-btn {
            border: none;
            cursor: pointer;
            color: white;
            font-weight: bold;
            transition: .2s;
            position: relative;

            border: 4px solid rgba(0, 0, 0, .12);

            box-shadow:
                inset 0 6px rgba(255, 255, 255, .5),
                inset 0 -8px rgba(0, 0, 0, .08),
                0 6px 0 rgba(0, 0, 0, .12);

            user-select: none;
        }

        .cartoon-btn:hover {
            transform: translateY(-2px);
        }

        .cartoon-btn:active {
            transform: translateY(4px);
            box-shadow:
                inset 0 6px rgba(255, 255, 255, .4),
                inset 0 -3px rgba(0, 0, 0, .05);
        }

        /* ===== Big Play ===== */

        .play-btn {
            width: 220px;
            height: 90px;
            border-radius: 50px;

            background: linear-gradient(to bottom,
                    #b8ea68,
                    #7fd03e);

            font-size: 42px;
            letter-spacing: 2px;
        }

        /* ===== Circle ===== */

        .circle-btn {
            width: 90px;
            height: 90px;
            border-radius: 50%;

            font-size: 40px;
        }

        .green {
            background: linear-gradient(#9bf05f, #59b93e);
        }

        .yellow {
            background: linear-gradient(#ffe56d, #ffba3b);
        }

        .blue {
            background: linear-gradient(#6fe7e2, #49b6e0);
        }

        .pink {
            background: linear-gradient(#ff6ba0, #d93f7b);
        }

        /* ===== Dialog ===== */

        .dialog {
            width: 450px;
            height: 230px;

            border-radius: 40px;

            background: linear-gradient(to bottom,
                    #ffd86f,
                    #ffcb54);

            border: 6px solid #ff9a72;

            position: relative;

            padding: 30px;
        }

        .dialog-close {
            position: absolute;
            right: -15px;
            top: -15px;

            width: 60px;
            height: 60px;

            border-radius: 50%;
            border: none;

            color: white;
            font-size: 30px;
            font-weight: bold;

            background: #ff4d8b;

            box-shadow: 0 5px 0 #d52f67;
        }

        .fake-line {
            height: 14px;
            background: rgba(255, 255, 255, .45);
            border-radius: 20px;
            margin-bottom: 15px;
        }

        .ok-btn {
            width: 130px;
            height: 55px;
            margin: auto;
            display: block;

            border-radius: 30px;

            font-size: 26px;

            background: linear-gradient(#91ec5f,
                    #63c848);
        }

        /* ===== Small Buttons ===== */

        .grid {
            display: grid;
            grid-template-columns: repeat(4, 80px);
            gap: 20px;
        }

        .small-btn {
            width: 80px;
            height: 60px;

            border-radius: 18px;

            color: white;
            font-size: 30px;

            background: linear-gradient(#98ef62,
                    #58b940);
        }

        /* ===== Progress ===== */

        .progress-wrap {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .heart-box {
            width: 70px;
            height: 50px;
            border-radius: 20px;
            background: #ffd7d7;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
        }

        .progress {
            width: 280px;
            height: 40px;
            border-radius: 20px;
            overflow: hidden;

            background: white;
            border: 4px solid #f4b1b1;
        }

        .bar {
            width: 55%;
            height: 100%;
            background: #ff4d89;
        }

        /* ===== Bottom Icons ===== */

        .icon {
            font-size: 60px;
        }

        .star {
            color: #ffcf4b;
        }

        .heart {
            color: #ff4d89;
        }

        .coin {
            color: #ffb62d;
        }

        .diamond {
            color: #59c7ff;
        }

        .gift {
            color: #67d95a;
        }

        .title {
            text-align: center;
            margin-bottom: 25px;
            color: #4a6a7d;
        }
    </style>
</head>

<body>

    <div class="game-ui">

        <h1 class="title">
            Cartoon Kids UI
        </h1>

        <div class="row">

            <button class="cartoon-btn play-btn">
                PLAY
            </button>

            <button class="cartoon-btn circle-btn green">
                ◀
            </button>

            <button class="cartoon-btn circle-btn yellow">
                🔍
            </button>

            <button class="cartoon-btn circle-btn blue">
                i
            </button>

            <button class="cartoon-btn circle-btn pink">
                ✕
            </button>

        </div>

        <div class="row">

            <div class="dialog">

                <button class="dialog-close">
                    ×
                </button>

                <div class="fake-line" style="width:70%"></div>
                <div class="fake-line" style="width:85%"></div>
                <div class="fake-line" style="width:55%"></div>

                <button class="cartoon-btn ok-btn">
                    OK
                </button>

            </div>

            <div class="grid">

                <button class="cartoon-btn small-btn">▶</button>
                <button class="cartoon-btn small-btn">▲</button>
                <button class="cartoon-btn small-btn">⚙</button>
                <button class="cartoon-btn small-btn">?</button>

                <button class="cartoon-btn small-btn">◀</button>
                <button class="cartoon-btn small-btn">☰</button>
                <button class="cartoon-btn small-btn">⌂</button>
                <button class="cartoon-btn small-btn">↻</button>

            </div>

        </div>

        <div class="row">

            <div class="progress-wrap">

                <div class="heart-box">
                    ❤️
                </div>

                <div class="progress">
                    <div class="bar"></div>
                </div>

            </div>

        </div>

        <div class="row">

            <div class="icon star">⭐</div>
            <div class="icon heart">❤️</div>
            <div class="icon coin">🪙</div>
            <div class="icon diamond">💎</div>
            <div class="icon gift">🎁</div>

        </div>

    </div>

    <script>

        document
            .querySelectorAll('.cartoon-btn')
            .forEach(btn => {

                btn.addEventListener('click', () => {

                    btn.animate(
                        [
                            { transform: 'scale(1)' },
                            { transform: 'scale(.9)' },
                            { transform: 'scale(1)' }
                        ],
                        {
                            duration: 180
                        });

                });

            });

    </script>

</body>

</html>
